<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080A0E">
  <title>October-San — Collection</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sky: #6BADE8;
      --black: #080A0E;
      --card: #111620;
      --text: #E8EDF5;
      --muted: #6B7A99;
      --faint: #2A3347;
      --green: #6BE8A0;
      --red: #E86B6B;
    }
    html, body { height: 100%; background: var(--black); color: var(--text); font-family: 'DM Mono', monospace; overscroll-behavior: none; }
    body { padding-top: env(safe-area-inset-top); }
    #app { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; padding-top: env(safe-area-inset-top); }

    /* ─── HEADER ─── */
    #header {
      flex-shrink: 0;
      background: var(--black);
      border-bottom: 1px solid var(--faint);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .back-btn {
      background: none;
      border: none;
      color: var(--sky);
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 0;
    }
    .header-username {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--text);
    }
    .header-stats {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 1px;
    }

    /* ─── FILTERS ─── */
    #filters {
      flex-shrink: 0;
      background: var(--black);
      border-bottom: 1px solid var(--faint);
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--faint);
      border-radius: 20px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn.active { background: var(--sky); border-color: var(--sky); color: var(--black); }

    /* ─── SEARCH ─── */
    #search-bar {
      flex-shrink: 0;
      padding: 8px 16px;
      border-bottom: 1px solid var(--faint);
    }
    .search-input {
      background: var(--card);
      border: 1px solid var(--faint);
      border-radius: 4px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      padding: 8px 12px;
      width: 100%;
      outline: none;
    }
    .search-input:focus { border-color: var(--sky); }

    /* ─── GRID ─── */
    #grid-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }
    .nft-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }
    .grid-item {
      position: relative;
      aspect-ratio: 3/4;
      background: var(--card);
      cursor: pointer;
      overflow: hidden;
    }
    .grid-item img, .grid-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .grid-item-token {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(8,10,14,0.7);
      color: var(--sky);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .grid-item.listed { outline: 2px solid var(--sky); }

    /* ─── SNAP OVERLAY ─── */
    #snap-overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    #snap-overlay.visible { display: flex; }
    #snap-header {
      flex-shrink: 0;
      padding: 12px 16px;
      padding-top: calc(12px + env(safe-area-inset-top));
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--faint);
      background: var(--black);
    }
    #snap-feed {
      flex: 1;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .snap-card {
      scroll-snap-align: start;
      position: relative;
      flex-shrink: 0;
    }
    .snap-card-media { width: 100%; height: 100%; object-fit: cover; display: block; }
    .snap-card-token {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(8,10,14,0.7);
      color: var(--sky);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .snap-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      background: linear-gradient(transparent, rgba(8,10,14,0.9));
    }
    .nft-name-label { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
    .snap-actions { display: flex; gap: 10px; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
    .btn-buy {
      background: var(--green);
      color: var(--black);
      border: none;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 20px;
      cursor: pointer;
      flex: 1;
      text-decoration: none;
      text-align: center;
    }

    /* ─── LOADING ─── */
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 200px; gap: 16px; color: var(--muted); font-size: 11px; letter-spacing: 2px; }
    .spinner { width: 24px; height: 24px; border: 2px solid var(--faint); border-top-color: var(--sky); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 1px var(--faint), 0 0 24px rgba(107,173,232,0.8); }
      50% { box-shadow: 0 0 0 1px var(--sky), 0 0 40px rgba(107,173,232,1); }
    }

    /* ─── TAB BAR ─── */
    #tab-bar {
      flex-shrink: 0;
      display: flex;
      background: var(--black);
      border-top: 1px solid var(--faint);
    }
    .tab { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; text-decoration: none; color: var(--muted); font-size: 9px; letter-spacing: 1.5px; gap: 2px; }
    .tab-icon { font-size: 18px; }
    .tab.active, .tab:hover { color: var(--sky); }
  </style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <div id="header">
    <button class="back-btn" onclick="history.back()">← BACK</button>
    <div class="header-username" id="header-username">COLLECTION</div>
    <div class="header-stats" id="header-stats"></div>
  </div>

  <!-- FILTERS -->
  <div id="filters">
    <button class="filter-btn active" onclick="setFilter('all')" id="f-all">ALL</button>
    <button class="filter-btn" onclick="setFilter('listed')" id="f-listed">LISTED</button>
    <button class="filter-btn" onclick="toggleSort()" id="f-sort">NEWEST ↓</button>
    <button class="filter-btn" onclick="openDatePicker()" id="f-date">ALL COLLECTIONS ▾</button>
  </div>

  <!-- SEARCH -->
  <div id="search-bar">
    <div style="position:relative;">
      <svg style="position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:0.4;" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" class="search-input" placeholder="Search..." id="search-input" oninput="renderGrid()" style="padding-left:32px;" />
    </div>
  </div>

  <!-- GRID -->
  <div id="grid-container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>LOADING COLLECTION...</span>
    </div>
    <div class="nft-grid" id="nft-grid" style="display:none;"></div>
    <div id="empty" style="display:none;text-align:center;padding:3rem;color:var(--muted);">No moments yet.</div>
  </div>

  <!-- SNAP OVERLAY -->
  <div id="snap-overlay">
    <div id="snap-header">
      <button onclick="closeSnap()" style="background:none;border:none;color:var(--sky);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:1px;cursor:pointer;">← BACK</button>
      <span id="snap-count" style="font-size:11px;letter-spacing:1px;color:var(--muted);"></span>
      <div style="width:60px;"></div>
    </div>
    <div id="snap-feed"></div>
  </div>

  <!-- TAB BAR -->
  <div id="tab-bar">
    <a class="tab" href="/" id="tab-home"><span class="tab-icon">◉</span><span>HOME</span></a>
    <a class="tab" href="/daily" id="tab-daily"><span class="tab-icon">⊞</span><span>DAILY</span></a>
    <a class="tab active" href="/my" id="tab-my"><span class="tab-icon">◯</span><span>MY</span></a>
    <a class="tab" href="/profile" id="tab-profile"><span class="tab-icon">⊙</span><span>PROFILE</span></a>
  </div>
</div>

<script type="module">
  import { createThirdwebClient } from 'https://esm.sh/thirdweb@5.120.1';
  import { ethers } from 'https://esm.sh/ethers@5.7.2';

  const CLIENT_ID = 'fb1460b2756706cc08a4f650e68fd526';
  const CONTRACT_ADDRESS = '0x1E1Ad40824f2F94F34a378033e96996a35d476D3';
  const MARKETPLACE_ADDRESS = '0x353aFb513F80F2D5b56D598EEA203D52D0D635f6';
  const FIREBASE_URL = 'https://firestore.googleapis.com/v1/projects/october-san-e3a33/databases/(default)/documents';
  const FIREBASE_API_KEY = 'AIzaSyBX6hKfUBi8oXx9ew22-jLpL4SxQJKoRIg';

  // Get address from URL
  const params = new URLSearchParams(window.location.search);
  const walletAddress = params.get('address');

  if (!walletAddress) {
    window.location.href = '/';
  }

  let userNFTs = [];
  let snapNFTs = [];
  let currentFilter = 'all';
  let currentSort = 'newest';
  let currentDate = 'all';
  let availableDates = [];

  function getDateFromName(name) {
    if (!name) return null;
    const match = name.match(/^(.+?)\s*·\s*(\w+ \d+, \d{4})/);
    if (match) {
      const title = match[1].replace(/\s*video\s*/i, '').trim();
      return title + ' · ' + match[2].trim();
    }
    const dateMatch = name.match(/(\w+ \d+, \d{4})/);
    return dateMatch ? dateMatch[1] : null;
  }

  function ipfsUrl(url) {
    if (!url) return null;
    return url.startsWith('ipfs://')
      ? `https://${CLIENT_ID}.ipfscdn.io/ipfs/${url.slice(7)}`
      : url;
  }

  async function firebaseGet(path) {
    const res = await fetch(`${FIREBASE_URL}/${path}?key=${FIREBASE_API_KEY}`);
    return res.json();
  }

  async function loadCollection() {
    try {
      // Get username
      try {
        const userData = await firebaseGet(`walletLookup/${walletAddress.toLowerCase()}`);
        const username = userData.fields?.username?.stringValue;
        document.getElementById('header-username').textContent = username ? '@' + username : walletAddress.substring(0,6) + '...' + walletAddress.slice(-4);
        document.title = username ? `@${username} — October-San` : 'Collection — October-San';
      } catch(e) {}

      // Fetch NFTs owned by this wallet
      const res = await fetch(
        `https://polygon.insight.thirdweb.com/v1/nfts?owner_address=${walletAddress}&contract_address=${CONTRACT_ADDRESS}&chain=137`,
        { headers: { 'x-client-id': CLIENT_ID } }
      );
      const data = await res.json();
      userNFTs = (data.data || []).map(nft => ({
        ...nft,
        image_url: ipfsUrl(nft.image_url),
        isVideo: nft.name?.toLowerCase().includes('video'),
        date: getDateFromName(nft.name),
      }));

      // Fetch marketplace listings
      const provider = new ethers.providers.JsonRpcProvider(`https://137.rpc.thirdweb.com/${CLIENT_ID}`);
      const marketAbi = [
        'function getAllListings(uint256 _startId, uint256 _endId) external view returns (tuple(uint256 listingId, uint256 tokenId, uint256 quantity, uint256 pricePerToken, uint128 startTimestamp, uint128 endTimestamp, address listingCreator, address assetContract, address currency, uint8 tokenType, uint8 status, bool reserved)[] listings)',
        'function totalListings() external view returns (uint256)',
      ];
      const marketplace = new ethers.Contract(MARKETPLACE_ADDRESS, marketAbi, provider);
      const total = await marketplace.totalListings();
      let activeListings = [];
      if (!total.eq(0)) {
        const listings = await marketplace.getAllListings(0, total.sub(1));
        const now = Math.floor(Date.now() / 1000);
        activeListings = listings.filter(l =>
          parseInt(l.status) === 1 &&
          l.assetContract.toLowerCase() === CONTRACT_ADDRESS.toLowerCase() &&
          l.listingCreator.toLowerCase() === walletAddress.toLowerCase() &&
          parseInt(l.endTimestamp) > now
        );
      }

      // Merge listings
      userNFTs = userNFTs.map(nft => {
        const listing = activeListings.find(l => l.tokenId.toString() === nft.token_id);
        if (listing) {
          const priceInPOL = ethers.utils.formatEther(listing.pricePerToken);
          return { ...nft, listed: true, listing_id: listing.listingId.toString(), price_pol: priceInPOL };
        }
        return { ...nft, listed: false };
      });

      // Also add listed NFTs held by marketplace
      const listedOnly = activeListings
        .filter(l => !userNFTs.find(n => n.token_id === l.tokenId.toString()))
        .map(l => ({
          token_id: l.tokenId.toString(),
          image_url: null,
          isVideo: false,
          listed: true,
          price_pol: ethers.utils.formatEther(l.pricePerToken),
        }));
      userNFTs = [...userNFTs, ...listedOnly].map(nft => ({
        ...nft,
        date: getDateFromName(nft.name),
      }));

      availableDates = [...new Set(userNFTs.map(n => n.date).filter(Boolean))];

      document.getElementById('header-stats').textContent = `${userNFTs.length} MOMENTS`;

      renderGrid();

    } catch(e) {
      console.error('Load error:', e);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
    }
  }

  function renderGrid() {
    document.getElementById('loading').style.display = 'none';
    
    const search = document.getElementById('search-input')?.value.toLowerCase() || '';
    let filtered = userNFTs.filter(nft => {
      if (currentFilter === 'listed' && !nft.listed) return false;
      if (currentDate !== 'all' && nft.date !== currentDate) return false;
      if (search && !nft.name?.toLowerCase().includes(search) && !nft.token_id?.includes(search)) return false;
      return true;
    });

    filtered = filtered.sort((a, b) =>
      currentSort === 'newest'
        ? parseInt(b.token_id) - parseInt(a.token_id)
        : parseInt(a.token_id) - parseInt(b.token_id)
    );

    snapNFTs = filtered;

    if (filtered.length === 0) {
      document.getElementById('nft-grid').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      return;
    }

    document.getElementById('empty').style.display = 'none';
    document.getElementById('nft-grid').style.display = 'grid';
    document.getElementById('nft-grid').innerHTML = filtered.map((nft, i) => `
      <div class="grid-item ${nft.listed ? 'listed' : ''}" onclick="openSnap(${i})">
        ${nft.image_url
          ? nft.isVideo
            ? `<video data-src="${nft.image_url}" muted playsinline loop preload="none" style="width:100%;height:100%;object-fit:cover;"></video>`
            : `<img src="${nft.image_url}" loading="lazy" />`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:1.5rem;">◆</div>`
        }
        <div class="grid-item-token">#${nft.token_id}</div>
      </div>
    `).join('');

    const gridObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          if (!video.src && video.dataset.src) { video.src = video.dataset.src; video.load(); }
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.grid-item video').forEach(v => gridObserver.observe(v));
  }

  window.setFilter = function(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('f-' + f).classList.add('active');
    document.getElementById('f-sort').classList.add('active');
    renderGrid();
  };

  window.toggleSort = function() {
    currentSort = currentSort === 'newest' ? 'oldest' : 'newest';
    document.getElementById('f-sort').textContent = currentSort === 'newest' ? 'NEWEST ↓' : 'OLDEST ↓';
    renderGrid();
  };

  window.openDatePicker = function() {
    const existing = document.getElementById('date-sheet');
    if (existing) { existing.remove(); return; }
    const sheet = document.createElement('div');
    sheet.id = 'date-sheet';
    sheet.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:1rem;z-index:600;max-height:50vh;overflow-y:auto;border-top:1px solid var(--faint);';
    const dates = ['All Collections', ...availableDates];
    sheet.innerHTML = `
      <div style="width:40px;height:4px;background:var(--faint);border-radius:2px;margin:0 auto 1rem;"></div>
      <div style="font-size:9px;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:0.75rem;">SELECT COLLECTION</div>
      ${dates.map((d, i) => `
        <div onclick="selectDate('${i === 0 ? 'all' : d}', '${i === 0 ? 'ALL COLLECTIONS' : d}')"
             style="padding:12px 16px;border-bottom:1px solid var(--faint);cursor:pointer;font-size:11px;letter-spacing:1px;color:${currentDate === (i === 0 ? 'all' : d) ? 'var(--sky)' : 'var(--text)'};">
          ${d}
        </div>
      `).join('')}
    `;
    document.body.appendChild(sheet);
    setTimeout(() => {
      document.addEventListener('click', function closeSheet(e) {
        if (!sheet.contains(e.target) && e.target.id !== 'f-date') {
          sheet.remove();
          document.removeEventListener('click', closeSheet);
        }
      });
    }, 100);
  };

  window.selectDate = function(date, label) {
    currentDate = date;
    document.getElementById('f-date').textContent = label + ' ▾';
    document.getElementById('date-sheet')?.remove();
    renderGrid();
  };

  window.openSnap = function(startIndex) {
    document.getElementById('snap-overlay').classList.add('visible');
    renderSnapFeed(startIndex);
  };

  window.closeSnap = function() {
    document.getElementById('snap-overlay').classList.remove('visible');
    document.getElementById('snap-feed').innerHTML = '';
  };

  function renderSnapFeed(startIndex) {
    const feed = document.getElementById('snap-feed');
    const snapH = window.innerHeight - 56;
    feed.style.height = snapH + 'px';
    feed.innerHTML = snapNFTs.map((nft, i) => `
      <div class="snap-card" style="height:${snapH}px;">
        ${nft.image_url
          ? nft.isVideo
            ? `<video data-src="${nft.image_url}" muted playsinline loop preload="none" style="width:100%;height:100%;object-fit:cover;" id="snapvid-${i}"></video>
               <button onclick="window.toggleMute(this, 'snapvid-${i}')" style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.5);border:none;border-radius:50%;width:36px;height:36px;color:white;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;">
                 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
               </button>`
            : `<img class="snap-card-media" src="${nft.image_url}" />`
          : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:3rem;">◆</div>`
        }
        <div class="snap-card-token">#${nft.token_id}</div>
        <div class="snap-card-overlay">
          <div class="nft-name-label">${nft.name || 'October-San Moment #' + nft.token_id}</div>
          <div class="snap-actions">
            ${nft.listed
              ? `<a class="btn-buy" href="/buy/${nft.token_id}">BUY · ${parseFloat(nft.price_pol).toFixed(2)} POL</a>`
              : ''
            }
          </div>
        </div>
      </div>
    `).join('');

    setTimeout(() => {
      feed.scrollTop = startIndex * snapH;
      document.getElementById('snap-count').textContent = `${startIndex + 1} / ${snapNFTs.length}`;
    }, 50);

    feed.onscroll = () => {
      const idx = Math.round(feed.scrollTop / snapH);
      document.getElementById('snap-count').textContent = `${idx + 1} / ${snapNFTs.length}`;
    };

    const snapObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          if (!video.src && video.dataset.src) video.src = video.dataset.src;
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.5 });
    feed.querySelectorAll('video').forEach(v => snapObserver.observe(v));
  }

  window.toggleMute = function(btn, videoId) {
    const video = document.getElementById(videoId);
    video.muted = !video.muted;
    btn.innerHTML = video.muted 
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>`
