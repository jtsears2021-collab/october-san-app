<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#080A0E">
  <title>October-San — Daily Collections</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sky: #6BADE8;
      --black: #080A0E;
      --card: #111620;
      --text: #E8EDF5;
      --muted: #6B7A99;
      --faint: #2A3347;
      --green: #6BE8A0;
      --red: #E86B6B;
    }
    html, body {
      height: 100%;
      background: var(--black);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      overscroll-behavior: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* ─── HEADER ─── */
    #header {
      flex-shrink: 0;
      background: var(--black);
      border-bottom: 1px solid var(--faint);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--text);
      text-decoration: none;
    }
    .logo span { color: var(--sky); }
    .header-title {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
    }

    /* ─── FILTERS ─── */
    #filters {
      flex-shrink: 0;
      background: var(--black);
      border-bottom: 1px solid var(--faint);
      padding: 8px 16px;
      display: flex;
      gap: 8px;
      align-items: center;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    #filters::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: transparent;
      border: 1px solid var(--faint);
      border-radius: 20px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      padding: 5px 12px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-btn.active { background: var(--sky); border-color: var(--sky); color: var(--black); }

    /* ─── SEARCH ─── */
    #search-bar {
      flex-shrink: 0;
      padding: 8px 16px;
      border-bottom: 1px solid var(--faint);
    }
    .search-input {
      background: var(--card);
      border: 1px solid var(--faint);
      border-radius: 4px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 16px;
      padding: 8px 12px;
      width: 100%;
      outline: none;
    }
    .search-input:focus { border-color: var(--sky); }

    /* ─── GRID ─── */
    #grid-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }
    .thumb {
      position: relative;
      aspect-ratio: 3/4;
      background: var(--card);
      cursor: pointer;
      overflow: hidden;
      border-radius: 2px;
    }
    .thumb img, .thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .thumb-token {
      position: absolute;
      top: 4px;
      left: 4px;
      background: rgba(8,10,14,0.7);
      color: var(--sky);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .thumb-listed {
      position: absolute;
      inset: 0;
      border: 2px solid var(--sky);
      border-radius: 2px;
      pointer-events: none;
    }
    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.2rem;
    }

    /* ─── SNAP SCROLL OVERLAY ─── */
    #snap-overlay {
      position: fixed;
      inset: 0;
      background: var(--black);
      z-index: 500;
      display: none;
      flex-direction: column;
    }
    #snap-overlay.visible { display: flex; }
    #snap-header {
      flex-shrink: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--faint);
      background: var(--black);
    }
    #snap-back {
      color: var(--sky);
      font-size: 13px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: 'DM Mono', monospace;
    }
    #snap-count {
      font-size: 10px;
      letter-spacing: 1px;
      color: var(--muted);
    }
    #snap-feed {
      flex: 1;
      overflow-y: auto;
      scroll-snap-type: y mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .snap-card {
      scroll-snap-align: start;
      height: 100%;
      position: relative;
      background: var(--black);
    }
    .snap-card-media {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .snap-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .snap-card-token {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(8,10,14,0.7);
      color: var(--sky);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .snap-card-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 16px 24px;
      background: linear-gradient(transparent, rgba(8,10,14,0.9));
    }
    .snap-user {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--card);
      border: 1px solid var(--sky);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: var(--sky);
      font-weight: 700;
      flex-shrink: 0;
    }
    .user-name { font-size: 12px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
    .nft-name-label { font-size: 10px; color: var(--muted); }
    .snap-actions { display: flex; gap: 10px; align-items: center; }
    .btn-buy {
      background: var(--green);
      color: var(--black);
      border: none;
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 20px;
      cursor: pointer;
      flex: 1;
    }
    .btn-action {
      background: transparent;
      color: var(--sky);
      border: 1px solid var(--sky);
      border-radius: 4px;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 10px 20px;
      cursor: pointer;
      flex: 1;
      text-decoration: none;
      text-align: center;
    }

    /* ─── LOADING ─── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      gap: 12px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--faint);
      border-top-color: var(--sky);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── TAB BAR ─── */
    #tab-bar {
      flex-shrink: 0;
      display: flex;
      background: var(--black);
      border-top: 1px solid var(--faint);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .tab {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--sky);
      font-family: 'DM Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      gap: 4px;
      text-decoration: none;
    }
    .tab.active { color: var(--text); }
    .tab-icon { font-size: 18px; }

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <div id="header">
    <a href="/" class="logo">October-<span>San</span>™</a>
    <span class="header-title">DAILY COLLECTIONS</span>
  </div>

  <!-- FILTERS -->
  <div id="filters">
    <button class="filter-btn active" onclick="setFilter('all')" id="f-all">ALL</button>
    <button class="filter-btn" onclick="setFilter('listed')" id="f-listed">LISTED</button>
    <button class="filter-btn" onclick="toggleSort()" id="f-sort">NEWEST ↓</button>
    <button class="filter-btn" onclick="openDatePicker()" id="f-date">ALL DATES ▾</button>
  </div>

  <!-- SEARCH -->
  <div id="search-bar">
    <input type="search" class="search-input" placeholder="🔍" id="search-input" oninput="renderGrid()" />
  </div>

  <!-- GRID -->
  <div id="grid-container">
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <span>LOADING...</span>
    </div>
    <div id="grid" class="grid" style="display:none;"></div>
    <div id="empty" class="empty" style="display:none;">No moments here. Try a different filter.</div>
  </div>

  <!-- TAB BAR -->
  <div id="tab-bar">
    <a class="tab" href="/">
      <span class="tab-icon">◉</span>
      <span>HOME</span>
    </a>
    <a class="tab active" href="/daily">
      <span class="tab-icon">⊞</span>
      <span>DAILY</span>
    </a>
    <a class="tab" href="/my">
      <span class="tab-icon">◯</span>
      <span>MY</span>
    </a>
    <a class="tab" href="/profile">
      <span class="tab-icon">⊙</span>
      <span>PROFILE</span>
    </a>
  </div>

</div>

<!-- SNAP SCROLL OVERLAY -->
<div id="snap-overlay">
  <div id="snap-header">
    <button id="snap-back" onclick="closeSnap()">← BACK</button>
    <span id="snap-count"></span>
  </div>
  <div id="snap-feed"></div>
</div>

<script type="module">
  import { ethers } from 'https://esm.sh/ethers@5.7.2';

  const CLIENT_ID = 'fb1460b2756706cc08a4f650e68fd526';
  const CONTRACT_ADDRESS = '0x1E1Ad40824f2F94F34a378033e96996a35d476D3';
  const MARKETPLACE_ADDRESS = '0x353aFb513F80F2D5b56D598EEA203D52D0D635f6';
  const FIREBASE_URL = 'https://firestore.googleapis.com/v1/projects/october-san-e3a33/databases/(default)/documents';
  const FIREBASE_API_KEY = 'AIzaSyBX6hKfUBi8oXx9ew22-jLpL4SxQJKoRIg';

  let allNFTs = [];
  let activeListings = [];
  let currentFilter = 'all';
  let currentSort = 'newest';
  let currentDate = 'all';
  let availableDates = [];
  let currentUser = null;
  let snapNFTs = [];

  // Load user from localStorage
  const stored = localStorage.getItem('octsn_user');
  if (stored) currentUser = JSON.parse(stored);

  function parseField(f) {
    if (!f) return null;
    if (f.stringValue !== undefined) return f.stringValue;
    if (f.booleanValue !== undefined) return f.booleanValue;
    if (f.integerValue !== undefined) return parseInt(f.integerValue);
    return null;
  }

  function getDateFromName(name) {
    if (!name) return null;
    const match = name.match(/(\w+ \d+, \d{4})/);
    return match ? match[1] : null;
  }

  function ipfsUrl(url) {
    if (!url) return null;
    return url.startsWith('ipfs://') ? `https://${CLIENT_ID}.ipfscdn.io/ipfs/${url.slice(7)}` : url;
  }

  async function loadData() {
    try {
      // Fetch all NFTs
      const res = await fetch(
        `https://137.insight.thirdweb.com/v1/nfts/${CONTRACT_ADDRESS}?limit=100`,
        { headers: { 'x-client-id': CLIENT_ID } }
      );
      const data = await res.json();
      allNFTs = (data.data || []).map(nft => ({
        ...nft,
        image_url: ipfsUrl(nft.image_url),
        isVideo: nft.name?.toLowerCase().includes('video'),
        date: getDateFromName(nft.name),
      }));

      // Get unique dates
      availableDates = [...new Set(allNFTs.map(n => n.date).filter(Boolean))];

      // Fetch marketplace listings
      const provider = new ethers.providers.JsonRpcProvider(`https://137.rpc.thirdweb.com/${CLIENT_ID}`);
      const marketAbi = [
        'function getAllListings(uint256 _startId, uint256 _endId) external view returns (tuple(uint256 listingId, uint256 tokenId, uint256 quantity, uint256 pricePerToken, uint128 startTimestamp, uint128 endTimestamp, address listingCreator, address assetContract, address currency, uint8 tokenType, uint8 status, bool reserved)[] listings)',
        'function totalListings() external view returns (uint256)',
      ];
      const marketplace = new ethers.Contract(MARKETPLACE_ADDRESS, marketAbi, provider);
      const total = await marketplace.totalListings();
      if (!total.eq(0)) {
        const listings = await marketplace.getAllListings(0, total.sub(1));
        const now = Math.floor(Date.now() / 1000);
        activeListings = listings.filter(l =>
          parseInt(l.status) === 1 &&
          l.assetContract.toLowerCase() === CONTRACT_ADDRESS.toLowerCase() &&
          parseInt(l.endTimestamp) > now
        );
      }

      // Merge listing data into NFTs
      allNFTs = allNFTs.map(nft => {
        const listing = activeListings.find(l => l.tokenId.toString() === nft.token_id);
        if (listing) {
          const priceInPOL = ethers.utils.formatEther(listing.pricePerToken);
          return {
            ...nft,
            listed: true,
            listing_id: listing.listingId.toString(),
            price_pol: priceInPOL,
            seller: listing.listingCreator,
          };
        }
        return { ...nft, listed: false };
      });

      document.getElementById('loading').style.display = 'none';
      renderGrid();

    } catch(e) {
      console.error('Load error:', e);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('empty').style.display = 'flex';
    }
  }

  window.renderGrid = function() {
    const search = document.getElementById('search-input').value.toLowerCase();
    let filtered = allNFTs.filter(nft => {
      if (currentFilter === 'listed' && !nft.listed) return false;
      if (currentDate !== 'all' && nft.date !== currentDate) return false;
      if (search && !nft.name?.toLowerCase().includes(search) && !nft.token_id.includes(search)) return false;
      return true;
    });

    filtered = filtered.sort((a, b) =>
      currentSort === 'newest'
        ? parseInt(b.token_id) - parseInt(a.token_id)
        : parseInt(a.token_id) - parseInt(b.token_id)
    );

    snapNFTs = filtered;

    if (filtered.length === 0) {
      document.getElementById('grid').style.display = 'none';
      document.getElementById('empty').style.display = 'flex';
      return;
    }

    document.getElementById('empty').style.display = 'none';
    document.getElementById('grid').style.display = 'grid';
    document.getElementById('grid').innerHTML = filtered.map((nft, i) => `
      <div class="thumb" onclick="openSnap(${i})">
        ${nft.image_url
          ? nft.isVideo
            ? `<video data-src="${nft.image_url}" muted playsinline loop preload="none" style="width:100%;height:100%;object-fit:cover;"></video>`
            : `<img src="${nft.image_url}" loading="lazy" />`
          : `<div class="thumb-placeholder">◆</div>`
        }
        <div class="thumb-token">#${nft.token_id}</div>
        ${nft.listed ? '<div class="thumb-listed"></div>' : ''}
      </div>
    `).join('');

    // Lazy load videos only when visible
    const gridObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          if (!video.src && video.dataset.src) {
            video.src = video.dataset.src;
          }
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.1, rootMargin: '100px' });

    let videoCount = 0;
    document.querySelectorAll('.grid video').forEach(v => {
      if (videoCount < 12) {
        gridObserver.observe(v);
        videoCount++;
      }
    });
  };
  window.setFilter = function(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('f-' + f).classList.add('active');
    document.getElementById('f-sort').classList.add('active');
    renderGrid();
  };

  window.toggleSort = function() {
    currentSort = currentSort === 'newest' ? 'oldest' : 'newest';
    document.getElementById('f-sort').textContent = currentSort === 'newest' ? 'NEWEST ↓' : 'OLDEST ↓';
    renderGrid();
  };

  window.openDatePicker = function() {
    const existing = document.getElementById('date-sheet');
    if (existing) { existing.remove(); return; }
    
    const sheet = document.createElement('div');
    sheet.id = 'date-sheet';
    sheet.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:16px 16px 0 0;padding:1rem;z-index:600;max-height:50vh;overflow-y:auto;border-top:1px solid var(--faint);';
    
    const dates = ['All Dates', ...availableDates];
    sheet.innerHTML = `
      <div style="width:40px;height:4px;background:var(--faint);border-radius:2px;margin:0 auto 1rem;"></div>
      <div style="font-size:9px;letter-spacing:2px;color:var(--muted);text-align:center;margin-bottom:0.75rem;">SELECT DATE</div>
      ${dates.map((d, i) => `
        <div onclick="selectDate('${i === 0 ? 'all' : d}', '${i === 0 ? 'ALL DATES' : d}')" 
             style="padding:12px 16px;border-bottom:1px solid var(--faint);cursor:pointer;font-size:11px;letter-spacing:1px;color:${currentDate === (i === 0 ? 'all' : d) ? 'var(--sky)' : 'var(--text)'};">
          ${d}
        </div>
      `).join('')}
    `;
    
    document.body.appendChild(sheet);
    
    // Close on outside tap
    setTimeout(() => {
      document.addEventListener('click', function closeSheet(e) {
        if (!sheet.contains(e.target) && e.target.id !== 'f-date') {
          sheet.remove();
          document.removeEventListener('click', closeSheet);
        }
      });
    }, 100);
  };

  window.selectDate = function(date, label) {
    currentDate = date;
    document.getElementById('f-date').textContent = label + ' ▾';
    document.getElementById('date-sheet')?.remove();
    renderGrid();
  }

  // ─── SNAP SCROLL ──────────────────────────────────────────
  window.openSnap = function(startIndex) {
    const overlay = document.getElementById('snap-overlay');
    overlay.classList.add('visible');
    renderSnapFeed(startIndex);
  };

  window.closeSnap = function() {
    document.getElementById('snap-overlay').classList.remove('visible');
    document.getElementById('snap-feed').innerHTML = '';
  };

  function renderSnapFeed(startIndex) {
    const feed = document.getElementById('snap-feed');
    const snapH = window.innerHeight - 56; // subtract snap header

    feed.style.height = snapH + 'px';
    feed.innerHTML = snapNFTs.map((nft, i) => {
      const ownerShort = nft.owner_addresses?.[0]
        ? nft.owner_addresses[0].substring(0,6) + '...' + nft.owner_addresses[0].slice(-4)
        : '—';
      const ownerAddr = nft.owner_addresses?.[0] || '';
      const isOwner = currentUser?.walletAddress?.toLowerCase() === (nft.seller?.toLowerCase() || '');
      return `
        <div class="snap-card" style="height:${snapH}px;">
          ${nft.image_url
            ? nft.isVideo
              ? `<video data-src="${nft.image_url}" muted playsinline loop preload="none" style="width:100%;height:100%;object-fit:cover;"></video>`
              : `<img class="snap-card-media" src="${nft.image_url}" />`
            : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:3rem;">◆</div>`
          }
          <div class="snap-card-token">#${nft.token_id}</div>
          <div class="snap-card-overlay">
            <div class="snap-user" onclick="viewUserCollection('${ownerAddr}')">
              <div class="user-avatar">${ownerShort.charAt(0).toUpperCase()}</div>
              <div>
                <div class="user-name">@${ownerShort}</div>
                <div class="nft-name-label">${nft.name || 'October-San Moment #' + nft.token_id}</div>
              </div>
            </div>
            <div class="snap-actions">
              ${nft.listed && !isOwner ? `<button class="btn-buy" onclick="window.location.href='/buy/${nft.token_id}'">BUY · ${parseFloat(nft.price_pol).toFixed(2)} POL</button>` : ''}
              ${nft.listed && isOwner ? `<a style="background:var(--sky);color:var(--black);border:none;border-radius:4px;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:10px 20px;flex:1;text-decoration:none;text-align:center;" href="/buy/${nft.token_id}">LISTED · ${parseFloat(nft.price_pol).toFixed(2)} POL</a>` : ''}
              ${!nft.listed && isOwner ? `<a class="btn-action" href="/list/${nft.token_id}">LIST FOR SALE</a>` : ''}
            </div>
          </div>
        </div>
      `;
    }).join('');

    // Scroll to start index
    setTimeout(() => {
      feed.scrollTop = startIndex * snapH;
      document.getElementById('snap-count').textContent = `${startIndex + 1} / ${snapNFTs.length}`;
    }, 50);

    // Update count on scroll
    feed.addEventListener('scroll', () => {
      const idx = Math.round(feed.scrollTop / snapH);
      document.getElementById('snap-count').textContent = `${idx + 1} / ${snapNFTs.length}`;
    });

    // Lazy load videos in snap scroll
    const snapObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting) {
          if (!video.src && video.dataset.src) {
            video.src = video.dataset.src;
          }
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.5 });

    feed.querySelectorAll('video').forEach(v => snapObserver.observe(v));
  }

  window.viewUserCollection = function(address) {
    if (address) window.location.href = '/user?address=' + address;
  };

  loadData();
</script>

</body>
</html>
